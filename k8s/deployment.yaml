apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-order-processor
  labels:
    app: cafe-order-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafe-order-processor
  template:
    metadata:
      labels:
        app: cafe-order-processor
    spec:
      containers:
      - name: cafe-app
        image: parthnerkar/cloud-cafe-order-processor1:v2
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: cafe-app-config
        volumeMounts:
        - name: invoice-volume
          mountPath: /home/ec2-user/invoice
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: invoice-volume
        hostPath:
          path: /home/ec2-user/invoice
          type: DirectoryOrCreate
